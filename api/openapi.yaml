        data:
          type: array
          items:
            $ref: "#/components/schemas/LinkedNote"
    SearchResult:
      type: object
      additionalProperties: false
      required:
        - id
        - spaceId
        - title
        - slug
        - snippet
        - rank
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        snippet:
          type: string
        rank:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
    SearchResultListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Attachment:
      type: object
      additionalProperties: false
      required:
        - id
        - noteId
        - originalName
        - mediaType
        - sizeBytes
        - sha256
        - publishedAt
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        originalName:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        publishedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
    AttachmentDataResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    CreateLearningNoteRequest:
      type: object
      additionalProperties: false
      required:
        - spaceId
        - title
        - markdown
      properties:
        spaceId:
          type: string
          format: uuid
        directoryId:
          type:
            - string
            - "null"
          format: uuid
        title:
          type: string
          minLength: 1
        markdown:
          type: string
    AutosaveLearningNoteRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - title
        - markdown
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
        markdown:
          type: string
    PublishLearningNoteRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    MoveLearningNoteRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - spaceId
        - directoryId
        - confirmPublish
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
        spaceId:
          type: string
          format: uuid
        directoryId:
          type:
            - string
            - "null"
          format: uuid
        confirmPublish:
          type: boolean
          description: Must be true when moving from a private Knowledge Space into a public one.
    VersionedNoteCommandRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 1
    NoteRevision:
      type: object
      additionalProperties: false
      required:
        - id
        - noteId
        - title
        - slug
        - markdown
        - reason
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        noteId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        markdown:
          type: string
        reason:
          type: string
          enum:
            - publish
            - restore
            - manual
        createdAt:
          type: string
          format: date-time
    NoteRevisionListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/NoteRevision"
        pagination:
          $ref: "#/components/schemas/Pagination"
    TrashNoteEntry:
      type: object
      additionalProperties: false
      required:
        - note
        - trashedAt
      properties:
        note:
          $ref: "#/components/schemas/LearningNote"
        trashedAt:
          type: string
          format: date-time
    TrashNoteListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TrashNoteEntry"
        pagination:
          $ref: "#/components/schemas/Pagination"
    RestoreTrashNoteRequest:
      type: object
      additionalProperties: false
      required:
        - confirmPublish
      properties:
        spaceId:
          type: string
          format: uuid
        directoryId:
          type:
            - string
            - "null"
          format: uuid
        confirmPublish:
          type: boolean
          description: Must be true when restoring into a public Knowledge Space; restoration and publication are atomic.
