openapi: 3.1.0
info:
  title: NoteFoundry API
  version: 0.1.0
  description: REST interface for the single-owner NoteFoundry learning workspace.
servers:
  - url: /
paths:
  /auth/github/start:
    get:
      operationId: startGitHubLogin
      summary: Start Knowledge Owner authentication through GitHub
      responses:
        "302":
          description: Redirect to GitHub OAuth authorization.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/github/callback:
    get:
      operationId: completeGitHubLogin
      summary: Complete GitHub OAuth authentication
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Owner session created; redirect to the management application.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: GitHub authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutOwner
      summary: End the current owner session
      security:
        - ownerSession: []
      responses:
        "204":
          description: Session ended or already absent.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/session:
    get:
      operationId: getOwnerSession
      summary: Return the authenticated Knowledge Owner session
      security:
        - ownerSession: []
      responses:
        "200":
          description: Current owner session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /healthz:
    get:
      operationId: getHealth
      summary: Report API process health
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report API dependency readiness
      responses:
        "200":
          description: The API can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: notefoundry_session
  responses:
    InvalidRequest:
      description: Request data is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: A valid Knowledge Owner session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated identity is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An internal error occurred without exposing implementation details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    OwnerSessionResponse:
      type: object
      additionalProperties: false
      required:
        - owner
        - expiresAt
      properties:
        owner:
          type: object
          additionalProperties: false
          required:
            - githubUserId
            - login
            - avatarUrl
          properties:
            githubUserId:
              type: integer
              format: int64
            login:
              type: string
            avatarUrl:
              type: string
              format: uri
        expiresAt:
          type: string
          format: date-time
