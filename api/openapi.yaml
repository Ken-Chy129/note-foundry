      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Public navigation Directory records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/public/notes/{noteId}:
    get:
      operationId: getPublishedLearningNote
      summary: Get Published Content only when its Knowledge Space is public
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Published Content returned without owner draft fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedLearningNote"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/public/notes/{noteId}/links:
    get:
      operationId: listPublishedNoteLinks
      summary: List forward links between Published Content in public Knowledge Spaces
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Public forward Note Links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedNoteDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/public/notes/{noteId}/backlinks:
    get:
      operationId: listPublishedNoteBacklinks
      summary: List backlinks derived only from Published Content in public Knowledge Spaces
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Public derived backlinks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedNoteDataResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/search:
    get:
      operationId: searchOwnerLearningNotes
      summary: Search all owner-visible current Learning Note content
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SpaceIdQuery"
        - $ref: "#/components/parameters/TagIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/SearchPageSize"
      responses:
        "200":
          description: Ranked current Learning Note search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/public/search:
    get:
      operationId: searchPublishedLearningNotes
      summary: Search only Published Content in public Knowledge Spaces
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SpaceIdQuery"
        - $ref: "#/components/parameters/TagIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/SearchPageSize"
      responses:
        "200":
          description: Ranked public Published Content search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultListResponse"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}/attachments:
    get:
      operationId: listLearningNoteAttachments
      summary: List managed Attachments owned by a Learning Note
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Learning Note Attachments including private draft files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: uploadLearningNoteAttachment
      summary: Upload an Attachment that remains private until referenced Published Content is published
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment stored using an immutable storage key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/attachments/{attachmentId}:
    get:
      operationId: downloadOwnerAttachment
      summary: Download an Attachment as the Knowledge Owner
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Attachment binary content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/public/attachments/{attachmentId}:
    get:
      operationId: downloadPublicAttachment
      summary: Download only an Attachment referenced by Published Content in a public Knowledge Space
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Public Attachment binary content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /healthz:
    get:
      operationId: getHealth
      summary: Report API process health
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report API dependency readiness
      responses:
        "200":
          description: The API can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: notefoundry_session
  responses:
    InvalidRequest:
      description: Request data is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: A valid Knowledge Owner session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated identity is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: The request body exceeds the allowed size.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An internal error occurred without exposing implementation details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many authentication requests were sent in the current window.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SpaceIdQuery:
      name: spaceId
      in: query
      schema:
        type: string
        format: uuid
    DirectoryIdQuery:
      name: directoryId
      in: query
      schema:
        type: string
        format: uuid
    TagIdQuery:
      name: tagId
      in: query
      schema:
        type: string
        format: uuid
    SearchQuery:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    SearchPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DirectoryId:
      name: directoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoteId:
      name: noteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    OwnerSessionResponse:
      type: object
      additionalProperties: false
      required:
        - owner
        - expiresAt
      properties:
        owner:
          type: object
          additionalProperties: false
          required:
            - githubUserId
            - login
            - avatarUrl
          properties:
            githubUserId:
              type: integer
              format: int64
            login:
              type: string
            avatarUrl:
              type: string
              format: uri
        expiresAt:
          type: string
          format: date-time
    KnowledgeSpace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - visibility
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        visibility:
          type: string
          enum:
            - private
            - public
    CreateKnowledgeSpaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - visibility
      properties:
        name:
          type: string
          minLength: 1
        visibility:
          type: string
          enum:
            - private
            - public
    RenameKnowledgeSpaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    KnowledgeSpaceListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSpace"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Directory:
      type: object
      additionalProperties: false
      required:
        - id
        - spaceId
        - parentId
        - name
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        parentId:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
          minLength: 1
    CreateDirectoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        parentId:
          type:
            - string
            - "null"
          format: uuid
    RenameDirectoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    MoveDirectoryRequest:
      type: object
      additionalProperties: false
