openapi: 3.1.0
info:
  title: NoteFoundry API
  version: 0.1.0
  description: REST interface for the single-owner NoteFoundry learning workspace.
servers:
  - url: /
paths:
  /auth/github/start:
    get:
      operationId: startGitHubLogin
      summary: Start Knowledge Owner authentication through GitHub
      responses:
        "302":
          description: Redirect to GitHub OAuth authorization.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/github/callback:
    get:
      operationId: completeGitHubLogin
      summary: Complete GitHub OAuth authentication
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Owner session created; redirect to the management application.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: GitHub authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutOwner
      summary: End the current owner session
      security:
        - ownerSession: []
      responses:
        "204":
          description: Session ended or already absent.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/session:
    get:
      operationId: getOwnerSession
      summary: Return the authenticated Knowledge Owner session
      security:
        - ownerSession: []
      responses:
        "200":
          description: Current owner session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/spaces:
    get:
      operationId: listKnowledgeSpaces
      summary: List Knowledge Spaces for the owner
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated Knowledge Spaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createKnowledgeSpace
      summary: Create a flat top-level Knowledge Space
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeSpaceRequest"
      responses:
        "201":
          description: Knowledge Space created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/spaces/{spaceId}:
    patch:
      operationId: renameKnowledgeSpace
      summary: Rename a Knowledge Space without changing its identity
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameKnowledgeSpaceRequest"
      responses:
        "200":
          description: Knowledge Space renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/spaces/{spaceId}/directories:
    get:
      operationId: listDirectories
      summary: Return the complete Directory hierarchy for a Knowledge Space
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Flat Directory records that can be assembled into a tree by parent ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createDirectory
      summary: Create a root or nested Directory in a Knowledge Space
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectoryRequest"
      responses:
        "201":
          description: Directory created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/directories/{directoryId}:
    patch:
      operationId: renameDirectory
      summary: Rename a Directory without changing its identity or location
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/DirectoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameDirectoryRequest"
      responses:
        "200":
          description: Directory renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/directories/{directoryId}/move:
    post:
      operationId: moveDirectory
      summary: Move a Directory to another parent in the same Knowledge Space
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/DirectoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveDirectoryRequest"
      responses:
        "200":
          description: Directory moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tags:
    get:
      operationId: listTags
      summary: List global flat Tags
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated Tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTag
      summary: Create a global flat Tag
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWriteRequest"
      responses:
        "201":
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tags/{tagId}:
    patch:
      operationId: renameTag
      summary: Rename a global Tag without changing its identity
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWriteRequest"
      responses:
        "200":
          description: Tag renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /healthz:
    get:
      operationId: getHealth
      summary: Report API process health
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report API dependency readiness
      responses:
        "200":
          description: The API can reach PostgreSQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: notefoundry_session
  responses:
    InvalidRequest:
      description: Request data is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: A valid Knowledge Owner session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The authenticated identity is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RequestTooLarge:
      description: The request body exceeds the allowed size.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An internal error occurred without exposing implementation details.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many authentication requests were sent in the current window.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DirectoryId:
      name: directoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    OwnerSessionResponse:
      type: object
      additionalProperties: false
      required:
        - owner
        - expiresAt
      properties:
        owner:
          type: object
          additionalProperties: false
          required:
            - githubUserId
            - login
            - avatarUrl
          properties:
            githubUserId:
              type: integer
              format: int64
            login:
              type: string
            avatarUrl:
              type: string
              format: uri
        expiresAt:
          type: string
          format: date-time
    KnowledgeSpace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - visibility
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        visibility:
          type: string
          enum:
            - private
            - public
    CreateKnowledgeSpaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - visibility
      properties:
        name:
          type: string
          minLength: 1
        visibility:
          type: string
          enum:
            - private
            - public
    RenameKnowledgeSpaceRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    KnowledgeSpaceListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeSpace"
        pagination:
          $ref: "#/components/schemas/Pagination"
    Directory:
      type: object
      additionalProperties: false
      required:
        - id
        - spaceId
        - parentId
        - name
      properties:
        id:
          type: string
          format: uuid
        spaceId:
          type: string
          format: uuid
        parentId:
          type:
            - string
            - "null"
          format: uuid
        name:
          type: string
          minLength: 1
    CreateDirectoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        parentId:
          type:
            - string
            - "null"
          format: uuid
    RenameDirectoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    MoveDirectoryRequest:
      type: object
      additionalProperties: false
      required:
        - parentId
      properties:
        parentId:
          type:
            - string
            - "null"
          format: uuid
    DirectoryListResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Directory"
    Tag:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    TagWriteRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    TagListResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        pagination:
          $ref: "#/components/schemas/Pagination"
