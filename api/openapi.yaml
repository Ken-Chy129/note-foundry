openapi: 3.1.0
info:
  title: NoteFoundry API
  version: 0.2.0
  description: REST interface for the single-owner NoteFoundry learning workspace and private Learning Sources.
servers:
  - url: /
paths:
  /auth/github/start:
    get:
      operationId: startGitHubLogin
      summary: Start Knowledge Owner authentication through GitHub
      responses:
        "302":
          description: Redirect to GitHub OAuth authorization.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/github/callback:
    get:
      operationId: completeGitHubLogin
      summary: Complete GitHub OAuth authentication
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Owner session created; redirect to the management application.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: GitHub authentication failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutOwner
      summary: End the current owner session
      security:
        - ownerSession: []
      responses:
        "204":
          description: Session ended or already absent.
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/session:
    get:
      operationId: getOwnerSession
      summary: Return the authenticated Knowledge Owner session
      security:
        - ownerSession: []
      responses:
        "200":
          description: Current owner session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/spaces:
    get:
      operationId: listKnowledgeSpaces
      summary: List Knowledge Spaces for the owner
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated Knowledge Spaces.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpaceListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createKnowledgeSpace
      summary: Create a flat top-level Knowledge Space
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeSpaceRequest"
      responses:
        "201":
          description: Knowledge Space created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/spaces/{spaceId}:
    patch:
      operationId: renameKnowledgeSpace
      summary: Rename a Knowledge Space without changing its identity
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameKnowledgeSpaceRequest"
      responses:
        "200":
          description: Knowledge Space renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSpace"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/spaces/{spaceId}/directories:
    get:
      operationId: listDirectories
      summary: Return the complete Directory hierarchy for a Knowledge Space
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Flat Directory records that can be assembled into a tree by parent ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createDirectory
      summary: Create a root or nested Directory in a Knowledge Space
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDirectoryRequest"
      responses:
        "201":
          description: Directory created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/directories/{directoryId}:
    patch:
      operationId: renameDirectory
      summary: Rename a Directory without changing its identity or location
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/DirectoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameDirectoryRequest"
      responses:
        "200":
          description: Directory renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/directories/{directoryId}/move:
    post:
      operationId: moveDirectory
      summary: Move a Directory to another parent in the same Knowledge Space
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/DirectoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveDirectoryRequest"
      responses:
        "200":
          description: Directory moved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tags:
    get:
      operationId: listTags
      summary: List global flat Tags
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated Tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTag
      summary: Create a global flat Tag
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWriteRequest"
      responses:
        "201":
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tags/{tagId}:
    patch:
      operationId: renameTag
      summary: Rename a global Tag without changing its identity
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagWriteRequest"
      responses:
        "200":
          description: Tag renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/tags/{tagId}/merge:
    post:
      operationId: mergeTag
      summary: Merge a global Tag into another while preserving all Note associations
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeTagRequest"
      responses:
        "200":
          description: Source Tag merged and target Tag returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}/tags:
    get:
      operationId: listLearningNoteTags
      summary: List global Tags attached to a Learning Note
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Learning Note Tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setLearningNoteTags
      summary: Replace the complete global Tag set for a Learning Note
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNoteTagsRequest"
      responses:
        "200":
          description: Updated Learning Note Tags.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDataResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}/links:
    get:
      operationId: listCurrentNoteLinks
      summary: List forward Note Links derived from the current canonical Markdown
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Current forward Note Links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedNoteDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}/backlinks:
    get:
      operationId: listCurrentNoteBacklinks
      summary: List backlinks automatically derived from other current Note Markdown
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Current derived backlinks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkedNoteDataResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sources:
    get:
      operationId: listLearningSources
      summary: List private Learning Source summaries for the owner
      security:
        - ownerSession: []
      parameters:
        - name: inbox
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated private Learning Source summaries. `inbox=true` restricts results to sources without a primary Knowledge Space.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSourceListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createManualLearningSource
      summary: Create a private manual Learning Source in the Source Inbox
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManualLearningSourceRequest"
      responses:
        "201":
          description: Manual Learning Source created and immediately ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSource"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sources/{sourceId}:
    get:
      operationId: getLearningSource
      summary: Get complete private Learning Source content for the owner
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Complete private Learning Source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningSource"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes:
    get:
      operationId: listLearningNotes
      summary: List current Learning Note drafts for the owner
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/SpaceIdQuery"
        - $ref: "#/components/parameters/DirectoryIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated Learning Note summaries for navigation. Full Markdown is loaded from the item endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningNoteListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createLearningNote
      summary: Create a Learning Note draft with stable identity
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLearningNoteRequest"
      responses:
        "201":
          description: Learning Note draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningNote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}:
    get:
      operationId: getLearningNote
      summary: Get the current owner draft and Published Content snapshot
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: Learning Note returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningNote"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: autosaveLearningNote
      summary: Autosave a Learning Note draft using optimistic concurrency
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutosaveLearningNoteRequest"
      responses:
        "200":
          description: Learning Note draft saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningNote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}/publish:
    post:
      operationId: publishLearningNote
      summary: Explicitly replace Published Content from the reviewed current draft
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishLearningNoteRequest"
      responses:
        "200":
          description: Published Content replaced and a Note Revision recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningNote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}/move:
    post:
      operationId: moveLearningNote
      summary: Move a Learning Note without changing identity; private-to-public moves publish atomically after confirmation
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveLearningNoteRequest"
      responses:
        "200":
          description: Learning Note moved, with publication included when required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningNote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}/revisions:
    get:
      operationId: listNoteRevisions
      summary: List private recoverable Note Revisions
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated Note Revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteRevisionListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createNoteRevisionCheckpoint
      summary: Create a manual recoverable checkpoint of the current draft
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedNoteCommandRequest"
      responses:
        "201":
          description: Manual Note Revision created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteRevision"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}/revisions/{revisionId}/restore:
    post:
      operationId: restoreNoteRevision
      summary: Restore a Note Revision into the current draft while preserving Published Content
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
        - $ref: "#/components/parameters/RevisionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedNoteCommandRequest"
      responses:
        "200":
          description: Revision restored and the pre-restore draft checkpointed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningNote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notes/{noteId}/trash:
    post:
      operationId: trashLearningNote
      summary: Move a Learning Note to Trash without changing its stable identity
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedNoteCommandRequest"
      responses:
        "204":
          description: Learning Note moved to Trash.
        "400":
          $ref: "#/components/responses/InvalidRequest"
