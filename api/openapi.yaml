      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreTrashNoteRequest"
      responses:
        "200":
          description: Learning Note restored. Public targets are published in the same confirmed action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningNote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/trash/notes/{noteId}:
    delete:
      operationId: permanentlyDeleteLearningNote
      summary: Explicitly and permanently delete a Learning Note already in Trash
      security:
        - ownerSession: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "204":
          description: Learning Note permanently deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/public/spaces/{spaceId}/notes:
    get:
