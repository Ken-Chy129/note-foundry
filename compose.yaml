services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notefoundry}
      POSTGRES_USER: ${POSTGRES_USER:-notefoundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notefoundry} -d ${POSTGRES_DB:-notefoundry}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - notefoundry_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["/usr/local/bin/notefoundry-migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    command: ["/usr/local/bin/notefoundry-api"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: :8080
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      ATTACHMENTS_DIR: /var/lib/notefoundry/attachments
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set}
      GITHUB_OWNER_ID: ${GITHUB_OWNER_ID:?GITHUB_OWNER_ID must be set}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - notefoundry_attachments:/var/lib/notefoundry/attachments
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["/usr/local/bin/notefoundry-worker"]
    environment: &worker_environment
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      ATTACHMENTS_DIR: /var/lib/notefoundry/attachments
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_USE_SSL: ${BACKUP_S3_USE_SSL:-true}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-notefoundry}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_DAILY_RETENTION: ${BACKUP_DAILY_RETENTION:-7}
      BACKUP_WEEKLY_RETENTION: ${BACKUP_WEEKLY_RETENTION:-8}
      BACKUP_TEMP_DIR: /tmp
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5s}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - notefoundry_attachments:/var/lib/notefoundry/attachments
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    environment:
      API_ORIGIN: http://api:8080
      API_INTERNAL_ORIGIN: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:80"
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - notefoundry_caddy_data:/data
      - notefoundry_caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["local-s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-notefoundry-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "127.0.0.1:${MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - notefoundry_minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["local-s3"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-notefoundry-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-notefoundry-backups}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing "local/$${BACKUP_S3_BUCKET}"

  restore:
    build:
      context: ./backend
    profiles: ["tools"]
    command: ["/usr/local/bin/notefoundry-restore", "-confirm"]
    environment: *worker_environment
    volumes:
      - notefoundry_attachments:/var/lib/notefoundry/attachments

volumes:
  notefoundry_postgres_data:
  notefoundry_attachments:
  notefoundry_caddy_data:
  notefoundry_caddy_config:
  notefoundry_minio_data:
